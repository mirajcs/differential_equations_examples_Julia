project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - first-order-differential-equations.ipynb
    - bifurcations-first-order-differential-equations.ipynb
    - numerical-methods/*.ipynb
    - second-order-linear/*.ipynb

website:
  title: "Differential Equations"
  navbar:
    left:
      #- href: index.qmd
       # text: Home
      - href: first-order-differential-equations.ipynb
        text: First-Order ODEs
      - href: bifurcations-first-order-differential-equations.ipynb
        text: Bifurcations
      - href: numerical-methods/index.ipynb
        text: Numerical Methods
      - href: second-order-linear/index.ipynb
        text: Second-Order Linear ODEs
  sidebar:
    - title: "Numerical Methods"
      style: docked
      contents:
        - numerical-methods/index.ipynb
        - numerical-methods/01-eulers-method.ipynb
        - numerical-methods/02-second-order-runge-kutta.ipynb
        - numerical-methods/03-runge-kutta-4.ipynb
        - numerical-methods/04-error-order-efficiency.ipynb
        - numerical-methods/05-stability-and-stiffness.ipynb
        - numerical-methods/06-adaptive-step-size.ipynb
        - numerical-methods/07-multistep-methods.ipynb
        - numerical-methods/08-systems-and-higher-order.ipynb
    - title: "Second-Order Linear Equations"
      style: docked
      contents:
        - second-order-linear/index.ipynb
        - second-order-linear/01-homogeneous-constant-coefficients.ipynb

format:
  html:
    toc: true
    code-fold: show

execute:
  freeze: auto   # reuse saved results instead of re-running code on every render
